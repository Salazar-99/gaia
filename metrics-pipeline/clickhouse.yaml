apiVersion: "clickhouse.altinity.com/v1"
kind: "ClickHouseInstallation"
metadata:
  name: "gaia-clickhouse"
  namespace: "gaia-metrics"
spec:
  configuration:
    users:
      otel/networks/ip:
        - "0.0.0.0/0"
        - "::/0"
      otel/profile: default
      otel/quota: default
    clusters:
      - name: "gaia-clickhouse"
        layout:
          shardsCount: 1
          replicasCount: 1
  defaults:
    templates:
      dataVolumeClaimTemplate: data-volume
  templates:
    volumeClaimTemplates:
      - name: data-volume
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi