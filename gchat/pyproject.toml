[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gchat"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "array-record>=0.8.3",
    "flax>=0.12.6",
    "gaia-metrics",
    "grain>=0.2.16",
    "huggingface_hub>=0.26.0",
    "jax>=0.9.2",
    "optax>=0.2.0",
    "orbax-checkpoint>=0.11.0",
    "pyarrow>=23.0.1",
    "rich>=14.2.0",
    "tokenizers>=0.22.2",
]

[project.optional-dependencies]
tpu = [
    "jax[tpu]>=0.9.2",
]
dashboard = [
    "python-fasthtml>=0.13.4",
]

[project.scripts]
gchat-download = "gchat.data.download:main"
gchat-scaling-dashboard = "gchat.dashboard:main"
gchat-token-bytes = "gchat.data.token_bytes:main"

[tool.uv]
find-links = ["https://storage.googleapis.com/jax-releases/libtpu_releases.html"]
prerelease = "allow"

[tool.hatch.build.targets.wheel]
packages = ["src/gchat"]
